services:
  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root

  reservation-service:
    build: ./reservation_service
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - mysql

  salle-service:
    build: ./salle_service
    ports:
      - "8081:8080"
    depends_on:
      - kafka
      - mysql

  user-service:
    build: ./user_service
    ports:
      - "8082:8080"
    depends_on:
      - kafka
      - mysql

