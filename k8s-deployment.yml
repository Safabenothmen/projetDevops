apiVersion: v1
kind: Namespace
metadata:
  name: projet-devops
---
# Configuration pour MySQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: projet-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: root
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: projet-devops
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
# Configuration pour Zookeeper
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: projet-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: bitnami/zookeeper:latest
        ports:
        - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: projet-devops
spec:
  selector:
    app: zookeeper
  ports:
    - protocol: TCP
      port: 2181
      targetPort: 2181
---
# Configuration pour Kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: projet-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: bitnami/kafka:latest
        env:
        - name: KAFKA_CFG_ZOOKEEPER_CONNECT
          value: zookeeper-service:2181
        - name: ALLOW_PLAINTEXT_LISTENER
          value: "yes"
        ports:
        - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: projet-devops
spec:
  selector:
    app: kafka
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092
---
# Configuration pour Reservation Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: projet-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      containers:
      - name: reservation-service
        image: projetdevops-reservation-service
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql-service:3306/reservation
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka-service:9092
---
apiVersion: v1
kind: Service
metadata:
  name: reservation-service
  namespace: projet-devops
spec:
  type: LoadBalancer
  selector:
    app: reservation-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
# Configuration pour Salle Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salle-service
  namespace: projet-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salle-service
  template:
    metadata:
      labels:
        app: salle-service
    spec:
      containers:
      - name: salle-service
        image: projetdevops-salle-service
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql-service:3306/reservation
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka-service:9092
---
apiVersion: v1
kind: Service
metadata:
  name: salle-service
  namespace: projet-devops
spec:
  type: LoadBalancer
  selector:
    app: salle-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
# Configuration pour User Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: projet-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: projetdevops-user-service
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql-service:3306/reservation
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka-service:9092
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: projet-devops
spec:
  type: LoadBalancer
  selector:
    app: user-service
